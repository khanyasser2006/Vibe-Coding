      <stop offset="0%" stop-color="#FEC5A8" />
      <stop offset="100%" stop-color="#F4784E" />
    </linearGradient>
  </defs>
  <!-- Background circular pill -->
  <rect width="64" height="64" rx="20" fill="url(#peachGrad)" />
